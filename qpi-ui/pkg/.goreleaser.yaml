version: 2

project_name: qpi

release:
  draft: true

before:
  hooks:
    - sh -c 'cd qpi-ui/internal/dashboard && CYPRESS_INSTALL_BINARY=0 npm ci'
    - sh -c 'cd qpi-ui/internal/dashboard && npm run build'
    - sh -c 'cd qpi-ui && go mod tidy'

builds:
  - id: qpi
    dir: qpi-ui
    main: .
    binary: qpi
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X 'main.Version={{.Tag}}'

archives:
  - id: qpi-archive
    name_template: "qpi-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [binary]
      - goos: darwin
        formats: [binary]
    files:
      - src: README.md
      - src: LICENSE
      - src: qpi-ui/qpi.config.example.yml
        dst: qpi.config.example.yml

nfpms:
  - id: qpi-linux-packages
    package_name: qpi
    file_name_template: "qpi_{{ .Version }}_{{ .Arch }}"
    maintainer: "SopherApps <team.sopherapps@gmail.com>"
    description: |
      Quantum Processing Interface (QPI) Server
      QPI is a distributed quantum control stack architecture designed
      to control multiple Quantum Processing Units (QPUs).
    homepage: https://github.com/SopherApps/qpi
    section: utils
    priority: optional
    bindir: /usr/local/bin
    
    # 1. Target all major Linux packaging flavors here:
    formats:
      - deb # Ubuntu, Debian, Pop!_OS, Mint
      - rpm # Fedora, RHEL, CentOS, Rocky Linux, openSUSE
      - apk # Alpine Linux (Note: Alpine uses OpenRC, not systemd, by default)

    contents:
      # Map the example config file to the live config destination. Aliased into
      # every override below: an override's `contents` replaces this list rather
      # than adding to it, so a format that declares one and omits this ships no
      # config for the operator to edit — and `qpi.service` names it.
      - &config-file
        src: qpi-ui/qpi.config.example.yml
        dst: /etc/qpi.config.yml
        type: config # Protects the file from being overwritten blindly during package updates

    overrides:
      deb:
        dependencies:
          - systemd
        contents:
          - *config-file
          - src: qpi-ui/pkg/qpi.service
            dst: /lib/systemd/system/qpi.service
      rpm:
        dependencies:
          - systemd
        contents:
          - *config-file
          - src: qpi-ui/pkg/qpi.service
            dst: /usr/lib/systemd/system/qpi.service
      apk:
        contents:
          - *config-file
          - src: qpi-ui/pkg/qpi.initd
            dst: /etc/init.d/qpi
            file_info:
              mode: 0755 # Crucial: Init scripts must be executable

    # Life-cycle execution hooks for starting and updating the service
    scripts:
      postinstall: qpi-ui/pkg/postinstall.sh
      preremove: qpi-ui/pkg/preremove.sh
      postremove: qpi-ui/pkg/postremove.sh