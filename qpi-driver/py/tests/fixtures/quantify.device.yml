# file containing the calibration data for the device
q0:
  element_type:
    path: "qpi_driver.executors.quantify.elements.calibrated_transmon.CalibratedTransmon"
    args:
      - q0
  rxy:
    amp180: 0.1
    motzoi: 0
  clock_freqs:
    f01: 5e9
    f12: 4.8e9
    readout: 6e9
  measure:
    pulse_amp: 0.25
    pulse_duration: 300e-9
    acq_delay: 100e-9
    integration_time: 1e-6
    # The line that separates the two readout clouds, which every meas_level=2
    # shot is assigned by. Defaults of 0/0 are wrong for any chain that does not
    # happen to straddle the imaginary axis, and the simulated one does not: both
    # clouds land with positive real parts, so every shot would read |1>.
    #
    # These are what `readout_discrimination` measures. Carried here so the
    # fixtures that do *not* run a full calibration still read out correctly, and
    # the loop test requires the routine to find them rather than trusting them.
    acq_rotation: 206.27
    acq_threshold: -1.7792

q1:
  element_type:
    path: "qpi_driver.executors.quantify.elements.calibrated_transmon.CalibratedTransmon"
    kwargs:
      name: q1
  rxy:
    amp180: 0.1
    motzoi: 0
  clock_freqs:
    f01: 5e9
    f12: 4.8e9
    readout: 6.010e9
  measure:
    pulse_amp: 0.25
    pulse_duration: 300e-9
    acq_delay: 100e-9
    integration_time: 1e-6
    # The line that separates the two readout clouds, which every meas_level=2
    # shot is assigned by. Defaults of 0/0 are wrong for any chain that does not
    # happen to straddle the imaginary axis, and the simulated one does not: both
    # clouds land with positive real parts, so every shot would read |1>.
    #
    # These are what `readout_discrimination` measures. Carried here so the
    # fixtures that do *not* run a full calibration still read out correctly, and
    # the loop test requires the routine to find them rather than trusting them.
    acq_rotation: 206.27
    acq_threshold: -1.7792

q0_q1:
  element_type: 
    path: "quantify_scheduler.device_under_test.composite_square_edge.CompositeSquareEdge"
    args:
    kwargs:
      parent_element_name: q0
      child_element_name: q1
  cz:
    square_amp: 0.5
    square_duration: 20e-9

q2:
  element_type:
    path: "qpi_driver.executors.quantify.elements.calibrated_transmon.CalibratedTransmon"
