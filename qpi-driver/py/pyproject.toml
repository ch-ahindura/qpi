[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpi-driver"
version = "0.4.2-rc.27"
description = "Quantum Processing Interface (QPI) QPU Driver"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Martin Ahindura", email = "team.sopherapps@gmail.com" },
]
dependencies = [
    "numpy>=2.0.0",
    "xarray>=2024.1.0",
    "pynng>=0.8.0",
    "requests>=2.31.0",
    "qiskit>=1.0.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "qiskit_qasm3_import"
]

[project.optional-dependencies]
cli = ["typer>=0.9.0"]
# the optional dependency sets below this correspond to builtin drivers
# to allow installing only a given driver, without installing the others
aer = ["qiskit-aer>=0.14.0"]
qiskit_aer = ["qpi-driver[aer]"]
quantify = [
    "quantify-scheduler",
    "qblox-instruments<1.3.0",
]
qblox = [
    "qblox-scheduler",
    "qblox-instruments<1.3.0",
]
quantify_tuner = ["qpi-driver[quantify]"]
qblox_tuner = ["qpi-driver[qblox]"]
bluefors_gen1 = []
mock = []
presto = []
sim = [
    "scqubits>=4.0",
    "qutip>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/sopherapps/qpi"
Repository = "https://github.com/sopherapps/qpi"
Documentation = "https://sopherapps.github.io/qpi/driver/"
Issues = "https://github.com/sopherapps/qpi/issues"
Changelog = "https://github.com/sopherapps/qpi/blob/main/CHANGELOG.md"

[project.scripts]
qpi-driver = "qpi_driver.cli:app"

[tool.pytest.ini_options]
markers = [
    "scqubits: needs the [sim] extra — physics-backed acquisition data (RFC 0004 §7, tier 3)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qpi_driver*"]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
override-dependencies = [
    "pyqt5-qt5>=5.15.10",
    "pyqt5>=5.15.10",
    "qcodes<0.57"
]

# Coverage is measured on the framework — the SDK, the CLI, the catalog and the
# executors that need no hardware — and gated there. The hardware executors are
# reported but not gated: they need real instruments, and a floor over code nobody
# can run in CI only invites tests that assert nothing (see `omit` below).
[tool.coverage.run]
source = ["qpi_driver"]
branch = true
# The worker runs in a subprocess; without this its lines look untested.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    # A bin script's entry guard: reached only by running the module, never by a test.
    'if __name__ == "__main__":',
    # The body of an abstract method is unreachable by definition — a subclass
    # overrides it, and the base is never called.
    "^\\s*\\.\\.\\.$",
]

[tool.coverage.paths]
# The subprocess sees an installed path; combine it with the source tree's.
source = ["qpi_driver", "*/qpi_driver"]
